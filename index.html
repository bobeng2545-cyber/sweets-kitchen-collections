
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SWEET's KITCHEN &amp; COLLECTIONS</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <a href="./index.html">
            SWEET's KITCHEN <span>&amp; COLLECTIONS</span>
        </a>
    </div>

    <nav class="nav" id="nav">
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#categories">Categories</a>
    </nav>

    <div class="header-actions">

        <!-- DARK / LIGHT MODE BUTTON -->
        <button
    type="button"
    class="theme-toggle"
    id="themeToggle"
    aria-label="Switch theme"
    title="Switch theme">

    <span class="material-symbols-outlined" id="themeIcon">
        dark_mode
    </span>

</button>

        <!-- SHOPPING CART ICON WITH COUNT BADGE -->
        <button type="button"
                class="cart-button"
                id="cartButton"
                aria-label="Open shopping cart"
                title="Shopping cart">

            <span class="material-symbols-outlined cart-icon"
                  aria-hidden="true">shopping_cart</span>

            <span class="cart-count"
                  id="cartCount"
                  aria-live="polite">0</span>
        </button>

        <!-- CUSTOMER NOTIFICATION BELL -->
        <div class="notification-area" id="notificationArea">

            <button type="button"
                    class="notification-button"
                    id="notificationButton"
                    aria-label="Open notifications"
                    aria-expanded="false"
                    aria-controls="notificationMenu"
                    title="Notifications">

                <span class="material-symbols-outlined"
                      aria-hidden="true">notifications</span>

                <span class="notification-count"
                      id="notificationCount"
                      aria-live="polite"
                      hidden>0</span>
            </button>

            <!-- NOTIFICATION DROPDOWN -->
            <div class="notification-menu"
                 id="notificationMenu"
                 hidden>

                <div class="notification-header">

                    <h3>Notifications</h3>

                    <button type="button"
                            id="markAllNotificationsRead">
                        Mark all as read
                    </button>

                </div>

                <div class="notification-list"
                     id="notificationList"
                     aria-live="polite">

                    <p class="empty-notifications">
                        No notifications yet.
                    </p>

                </div>

                <div class="notification-footer">

                    <button type="button"
                            id="clearNotifications">
                        Clear all notifications
                    </button>

                </div>

            </div>

        </div>

        
<!-- CUSTOMER PROFILE -->
<div class="profile-area" id="profileArea">

    <button type="button"
            class="profile-button"
            id="profileButton"
            aria-label="Customer profile"

            <div class="customer-ai-message assistant">
                <div class="customer-ai-message-avatar">
                    <span class="material-symbols-outlined">smart_toy</span>
                </div>

                <div class="customer-ai-message-content">
                    <strong>Welcome!</strong>

                    <p>
                        I'm your Sweet AI shopping assistant.
                        I will help you find products, compare prices
                        and answer shopping questions.
                    </p>

                    <p>
                        What would you like help with today?
                    </p>
                </div>
            </div>

        </div>


        <div class="customer-ai-suggestions">

            <button type="button" data-ai-question="Help me find a product.">
                Find a product
            </button>

            <button type="button" data-ai-question="Help me compare products.">
                Compare products
            </button>

            <button type="button" data-ai-question="How can I get help with delivery?">
                Delivery help
            </button>

        </div>


        <form class="customer-ai-input-area" id="customerAIForm">

            <input
                type="text"
                id="customerAIInput"
                placeholder="Ask me anything..."
                autocomplete="off"
                maxlength="1000"
                aria-label="Type your question"
                required
            >

            <button
                type="submit"
                id="customerAISend"
                aria-label="Send message"
            >
                <span class="material-symbols-outlined">send</span>
            </button>

        </form>


        <p class="customer-ai-footer">
            Sweet AI Assistant
        </p>

    </section>

</div>
    <script src="customer-ai.js" defer></script>
</body>
</html>
